<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111d">
  <meta name="description" content="A little hello from the web.">
  <title>Hello, World!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      color-scheme: dark;
      font-family: 'DM Sans', sans-serif;
      background: #10111d;
      color: #f7f5ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, #5536ab55 0, transparent 38%),
        radial-gradient(ellipse at 82% 82%, #067e9450 0, transparent 36%),
        #10111d;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      width: 28rem;
      height: 28rem;
      border: 1px solid #ffffff0c;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -15rem; right: -7rem; box-shadow: 0 0 0 3rem #ffffff04, 0 0 0 6rem #ffffff03; }
    body::after { bottom: -18rem; left: -8rem; box-shadow: 0 0 0 3rem #ffffff04, 0 0 0 6rem #ffffff03; }

    main {
      position: relative;
      width: min(680px, calc(100% - 40px));
      padding: clamp(2rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffffff12, #ffffff05 65%);
      box-shadow: 0 32px 100px #0007, inset 0 1px #ffffff1c;
      backdrop-filter: blur(18px);
      animation: arrive 900ms cubic-bezier(.2,.8,.2,1) both;
    }

    .sparkle {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 2rem;
      border: 1px solid #ffffff24;
      border-radius: 22px;
      background: linear-gradient(135deg, #a78bfa35, #38d9e835);
      font-size: 2rem;
      box-shadow: 0 0 42px #8b5cf633;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #b9b0d3;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3.4rem, 12vw, 6.25rem);
      line-height: .98;
      letter-spacing: -.075em;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 12%, #67e8f9 88%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .message {
      max-width: 390px;
      margin: 1.5rem auto 2.2rem;
      color: #c1bfd0;
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      padding: .9rem 1.25rem;
      border: 1px solid #ffffff2c;
      border-radius: 999px;
      color: #fff;
      background: #ffffff12;
      font: 600 .92rem 'DM Sans', sans-serif;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }
    .button:hover { transform: translateY(-2px); border-color: #c4b5fd80; background: #ffffff1d; }
    .button:focus-visible { outline: 3px solid #67e8f9; outline-offset: 4px; }
    .arrow { color: #67e8f9; font-size: 1.1rem; }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      color: #858296;
      font-size: .78rem;
      letter-spacing: .04em;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A small beginning</p>
    <h1>Hello,<br><span>World!</span></h1>
    <p class="message">A little page with a lot of possibility. Here’s to whatever you make next.</p>
    <a class="button" href="https://developer.mozilla.org/en-US/docs/Learn" target="_blank" rel="noreferrer">
      Explore the web <span class="arrow" aria-hidden="true">↗</span>
    </a>
  </main>
  <div class="footer">Made with a little wonder&nbsp; ✨</div>
</body>
</html>
